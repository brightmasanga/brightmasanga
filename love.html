<!DOCTYPE html>
<html>
<head>
    <title>For My Special Girl 💖</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
        }

        h1 {
            margin-top: 100px;
            font-size: 40px;
        }

        #typeText {
            font-size: 22px;
            margin: 20px;
            min-height: 40px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 20px;
            transition: 0.3s;
        }

        #yesBtn {
            background-color: #28a745;
            color: white;
        }

        #noBtn {
            background-color: #dc3545;
            color: white;
            position: absolute;
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            color: pink;
            font-size: 20px;
            animation: float 5s linear infinite;
        }

        @keyframes float {
            0% {transform: translateY(100vh); opacity: 1;}
            100% {transform: translateY(-10vh); opacity: 0;}
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<h1>Hey Beautiful 💖</h1>
<div id="typeText"></div>

<form action="https://formsubmit.co/brightmasanga9@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="She Said YES!!! 💕">
    <input type="hidden" name="response" value="She accepted your proposal 💖">
    <button type="submit" id="yesBtn">Yes 😍</button>
</form>

<button id="noBtn">No 🙈</button>

<canvas id="fireworks"></canvas>

<audio id="bgMusic" autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
</audio>

<script>
    // TYPEWRITER EFFECT
    const text = "From the moment I met you, something felt different... Will you be my girlfriend? 🥺";
    let i = 0;
    function typeWriter() {
        if (i < text.length) {
            document.getElementById("typeText").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, 50);
        }
    }
    typeWriter();

    // RUNNING NO BUTTON
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", function() {
        noBtn.style.left = Math.random() * window.innerWidth + "px";
        noBtn.style.top = Math.random() * window.innerHeight + "px";
    });

    // FLOATING HEARTS
    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💗";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 10 + "px";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);
    }
    setInterval(createHeart, 300);

    // FIREWORKS EFFECT
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    document.getElementById("yesBtn").addEventListener("click", function() {
        for (let i = 0; i < 100; i++) {
            ctx.beginPath();
            ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 3, 0, Math.PI*2);
            ctx.fillStyle = "white";
            ctx.fill();
        }
    });
</script>

</body>
</html>
